# Render Blueprint: one free web service that serves the game and the squad relay.
# On render.com: New > Blueprint, pick this repo, and it fills these settings in.
services:
  - type: web
    name: sector-4
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Free Neon Postgres connection string, so fight records survive restarts. Set it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
